server:
  port: 8085

spring:
  application:
    name: microservice-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost"
              - "http://localhost:*"
              - "http://localhost:80"
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://localhost:5175"
              - "https://marcocarrasco.org"
              - "http://marcocarrasco.org"
              - "https://*.trycloudflare.com"
              - "https://*.duckdns.org"
              - "https://clp7432.duckdns.org"
              - "http://clp7432.duckdns.org"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: msvc-iot
          uri: lb://microservice-iot
          predicates:
            - Path=/api/iot/**

        - id: msvc-facturacion
          uri: lb://microservice-facturacion
          predicates:
            - Path=/api/facturas,/api/facturas/**

        - id: msvc-compras
          uri: lb://microservice-compras
          predicates:
            - Path=/api/proveedores/**,/api/ordenes-compra/**

        - id: msvc-users
          uri: lb://microservice-users
          predicates:
            - Path=/api/usuarios/**,/api/roles/**,/api/permisos/**,/api/auditorias/**

        - id: msvc-ventas
          uri: lb://microservice-ventas
          predicates:
            - Path=/api/ventas/**,/api/turnos/**,/api/cortes/**,/api/dispensarios/**,/api/cortes-detallado/**,/api/precios/**,/api/admin/**

        - id: msvc-inventarios
          uri: lb://microservice-inventarios
          predicates:
            - Path=/api/combustibles/**,/api/aceites/**,/api/inventario-combustible/**,/api/inventario-aceites/**,/api/cargas-pipa/**,/api/cargas/**

        - id: msvc-clientes
          uri: lb://microservice-clientes
          predicates:
            - Path=/api/clientes/**,/api/creditos/**,/api/admin-clientes/**

        - id: msvc-nomina
          uri: lb://microservice-nomina
          predicates:
            - Path=/api/departamentos/**,/api/puestos/**,/api/empleados/**,/api/incidencias/**,/api/nominas/**

        - id: msvc-reportes
          uri: lb://microservice-reportes
          predicates:
            - Path=/api/dashboard/**,/api/reportes/**

        - id: msvc-lealtad
          uri: lb://microservice-lealtad
          predicates:
            - Path=/api/transacciones/**,/api/recompensas/**,/api/cuentas-puntos/**,/api/canjes/**,/api/programas/**

        - id: msvc-ia
          uri: lb://microservice-ia
          predicates:
            - Path=/api/ia/**

eureka:
  client:
    service-url:
      defaultZone: http://msvc-eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: gateway

logging:
  level:
    org.springframework.cloud.gateway: WARN

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      enabled: true